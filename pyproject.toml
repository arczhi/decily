[project]
name = "decision-model"
version = "0.1.0"
description = "Explicit candidate-scorer decision model (Jev/System One style, Route B)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "transformers>=4.53",
    "datasets>=3.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "safetensors>=0.4",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.0",
    "peft>=0.13",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
