seed: 0
model:
  route: a
  backbone: Qwen/Qwen3-0.6B-Base
  freeze_backbone: true
  lora: true
  lora_r: 16
  lora_alpha: 32
  label_smoothing: 0.05
data:
  collator:
    max_state_tokens: 1024
    max_question_tokens: 128
    max_option_tokens: 48
    max_total_tokens: 2048
  min_options: 2
  max_options: 10
  eval_path: data/eval/stage1_intask.jsonl
  probe_path: data/raw/sst2_train.jsonl
  manifest:
    - {task: sst2, path: data/raw/sst2_train.jsonl, weight: 1.0}
    - {task: ag_news, path: data/raw/ag_news_train.jsonl, weight: 1.0}
    - {task: mnli, path: data/raw/mnli_train.jsonl, weight: 1.0}
    - {task: arc_easy, path: data/raw/arc_easy_train.jsonl, weight: 1.0}
train:
  steps: 3000
  batch_size: 16
  lr: 0.0002
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 100
  scheduler: cosine
  log_every: 20
  eval_every: 500
  eval_batch_size: 64
  eval_max_batches: 50
  out_dir: runs/baseline_a0
  seed: 0
  device: cuda
  label_smoothing: 0.05
