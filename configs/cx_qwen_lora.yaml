seed: 0
model:
  route: cx
  backbone: Qwen/Qwen3-0.6B-Base
  freeze_backbone: true
  lora: true
  lora_r: 16
  lora_alpha: 32
  pool: attention
  attn_implementation: sdpa
  dtype: bfloat16
  dropout: 0.0
  label_smoothing: 0.05
data:
  collator:
    max_state_tokens: 512
    max_question_tokens: 96
    max_option_tokens: 64
  min_options: 2
  max_options: 10
  eval_path: data/eval/stage1_intask.jsonl
  probe_path: data/raw/sst2_train.jsonl
  manifest:
    - {task: sst2, path: data/raw/sst2_train.jsonl, weight: 1.0}
    - {task: ag_news, path: data/raw/ag_news_train.jsonl, weight: 1.0}
    - {task: mnli, path: data/raw/mnli_train.jsonl, weight: 1.0}
    - {task: arc_easy, path: data/raw/arc_easy_train.jsonl, weight: 1.0}
train:
  steps: 3000
  batch_size: 8
  lr: 0.0002
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accum: 2
  warmup_steps: 100
  scheduler: cosine
  log_every: 100
  eval_every: 500
  eval_batch_size: 64
  eval_max_batches: 50
  out_dir: runs/cx_qwen_lora
  seed: 0
  device: cuda
  label_smoothing: 0.05
